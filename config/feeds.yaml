# ============================================================
#  资讯源配置 - 想换关注方向，改这个文件即可（无需改代码）
# ============================================================
#
# 结构说明：
#   settings   : 全局抓取/保留策略
#   categories : 分类列表，新增/删除/重命名分类后前端会自动跟着变
#     - id       : 分类标识（英文，前端筛选用）
#     - name     : 分类显示名
#     - color    : 分类主题色
#     - keywords : 分类级关键词过滤（空列表 = 不过滤，全量保留）
#                  命中标题或摘要中的任意一个词即保留
#     - feeds    : 该分类下的 RSS / Atom 源
#         - name     : 来源显示名
#         - url      : RSS/Atom 地址
#         - keywords : 可选，覆盖分类级关键词（给综合型源单独设过滤条件）
#         - disabled : true 表示临时停用该源
#
# 提示：不想看某个方向，直接删掉对应分类，或给源标上 disabled: true。
# ============================================================

settings:
  retention_days: 3          # 首页保留最近几天的新闻
  max_items_per_feed: 15     # 单个源每次最多取多少条
  max_total_items: 600       # news.json 最多保留多少条（防止文件无限膨胀）
  request_timeout: 20        # 单个源的请求超时（秒）
  exclude_keywords: []       # 全局排除关键词，例如 ["广告", "赞助", "招聘"]

# 可选：AI 一句话摘要（见 scripts/summarize.py；未配置 API Key 时自动跳过）
ai:
  enabled: true
  max_items_per_run: 40      # 每次运行最多摘要多少条
  max_age_hours: 48          # 只摘要最近多少小时内发布的新闻
  batch_size: 20             # 每次请求打包多少条

categories:
